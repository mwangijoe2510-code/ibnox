<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agrovet POS · Demo by NOX Digital</title>
<style>
:root{--paper:#f3f2ee;--card:#fbfaf7;--ink:#0a0a0a;--mute:#66665f;--line:rgba(10,10,10,.16)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--ink);color:var(--paper);padding:14px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header b{letter-spacing:.14em;font-size:.8rem;text-transform:uppercase}
header nav{display:flex;gap:6px;flex:1}
header button{color:#a3a29b;padding:8px 14px;border-radius:9px;border:0;background:none;font:inherit;cursor:pointer}
header button.on{background:var(--paper);color:var(--ink);font-weight:600}
header small{color:#8d8c85}
main{max-width:1180px;margin:0 auto;padding:20px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.kpis div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.kpis small{color:var(--mute);display:block;font-size:.8rem}.kpis b{font-size:1.4rem}.kpis .warn{border:2px solid var(--ink)}
.sell{display:grid;grid-template-columns:1fr 330px;gap:18px}
input,select{font:inherit;border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:var(--card);width:100%}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.cats button{border:1px solid var(--line);border-radius:99px;padding:5px 13px;background:none;cursor:pointer;font:inherit}
.cats button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.items button{text-align:left;border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--card);cursor:pointer;display:flex;flex-direction:column;gap:3px;font:inherit}
.items button:hover:not(:disabled){border-color:var(--ink)}.items button:disabled{opacity:.4;cursor:not-allowed}
.items small{color:var(--mute)}.items .low{color:var(--ink);font-weight:700}
.cart{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;align-self:start;display:flex;flex-direction:column;gap:9px}
.cart h3,h4{margin:0;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase}
.line{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;border-bottom:1px dashed var(--line);padding:5px 0;font-size:.93rem}
.qty button{width:24px;height:24px;border:1px solid var(--line);border-radius:50%;background:none;cursor:pointer}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{border:1px solid var(--line);border-radius:10px;padding:8px;background:none;cursor:pointer;font:inherit}
.seg button.on{background:var(--ink);color:var(--paper)}
.total{display:flex;justify-content:space-between;font-size:1.15rem;padding-top:8px}
.btn{border:1px solid var(--ink);border-radius:99px;padding:12px 20px;font:inherit;font-weight:600;cursor:pointer;background:var(--ink);color:var(--paper)}
.btn.ghost{background:none;color:var(--ink)}.btn:disabled{opacity:.35;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap}
.rc{display:flex;flex-direction:column;gap:7px;font-size:.93rem}.rc>div{display:flex;justify-content:space-between;gap:10px}
.rc .t{border-top:2px solid var(--ink);padding-top:9px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
th{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);text-align:left;padding:10px}
td{padding:11px 10px;border-top:1px solid var(--line)}
tr.lowrow td:nth-child(4){font-weight:700}
.mini{border:1px solid var(--line);border-radius:8px;background:none;padding:3px 9px;cursor:pointer}
.grid2{display:grid;grid-template-columns:1fr 280px;gap:18px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:10px}
.bar{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;font-size:.9rem}
.bar i{display:block;height:10px;background:var(--paper);border-radius:9px;overflow:hidden;border:1px solid var(--line)}.bar u{display:block;height:100%;background:var(--ink)}
.rep{display:grid;grid-template-columns:1fr 1fr;gap:18px}
li{list-style:none}ul,ol{margin:0;padding:0;display:grid;gap:6px}
li.r{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:5px 0;font-size:.93rem}
.dim{color:var(--mute)}
footer{text-align:center;color:var(--mute);padding:30px 20px;font-size:.85rem}
footer a{color:inherit}
@media(max-width:820px){.sell,.grid2,.rep{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}
@media print{header,.kpis,footer,.noprint{display:none!important}}
</style>
</head>
<body>
<header>
  <b>Agrovet POS</b>
  <nav id="nav"></nav>
  <small>Demo by NOX Digital · data stays on this device</small>
</header>
<main>
  <div class="kpis" id="kpis"></div>
  <div id="view"></div>
</main>
<footer>This is a demo with made-up products. Want a POS built for your shop? <a href="https://wa.me/254715404194" target="_blank" rel="noopener">Chat to NOX Digital on WhatsApp</a>.<br><button class="mini" onclick="resetAll()" style="margin-top:10px">Reset demo data</button></footer>
<script>
const KEY='nox-agrovet-demo-v1';
const START=[
 {id:1,name:'Dairy meal 70kg',cat:'Feeds',price:2600,stock:24},{id:2,name:'Layers mash 70kg',cat:'Feeds',price:3100,stock:18},
 {id:3,name:'Dewormer 100ml',cat:'Drugs',price:450,stock:40},{id:4,name:'Tick spray 1L',cat:'Drugs',price:1200,stock:9},
 {id:5,name:'Maize seed 2kg',cat:'Seeds',price:650,stock:60},{id:6,name:'Kale seed 100g',cat:'Seeds',price:180,stock:35},
 {id:7,name:'CAN fertiliser 50kg',cat:'Fertiliser',price:3800,stock:12},{id:8,name:'Knapsack sprayer',cat:'Tools',price:4200,stock:5}];
const CATS=['All','Feeds','Drugs','Seeds','Fertiliser','Tools'],LOW=10;
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=S||{stock:START,sales:[],seq:1000};
let cart={},cat='All',q='',view='sell',method='cash',phone='0712 345 678',paid=null,stk=false;
const $=s=>document.querySelector(s);
const kes=n=>'KES '+Math.round(n).toLocaleString('en-KE');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const dl=(n,t,m)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m||'text/plain'}));a.download=n;a.click()};
function resetAll(){if(confirm('Reset all demo data?')){S={stock:START,sales:[],seq:1000};cart={};paid=null;save();render()}}
function add(id){const s=S.stock.find(x=>x.id==id);if((cart[id]||0)<s.stock){cart[id]=(cart[id]||0)+1;render()}}
function dec(id){cart[id]--;if(cart[id]<=0)delete cart[id];render()}
function lines(){return S.stock.filter(s=>cart[s.id])}
function total(){return lines().reduce((a,s)=>a+s.price*cart[s.id],0)}
function pay(){
  if(!total())return;
  if(method==='mpesa'){stk=true;render();setTimeout(finish,1300)}else finish();
}
function finish(){
  const r={no:++S.seq,time:new Date().toLocaleTimeString('en-KE',{hour:'2-digit',minute:'2-digit'}),date:new Date().toLocaleDateString('en-KE'),method,phone:method==='mpesa'?phone:'',
    lines:lines().map(s=>({name:s.name,cat:s.cat,qty:cart[s.id],amt:s.price*cart[s.id]})),total:total()};
  S.stock.forEach(s=>{if(cart[s.id])s.stock-=cart[s.id]});
  S.sales.unshift(r);paid=r;cart={};stk=false;save();render();
}
function rtext(r){return ['AGROVET POS (DEMO)','Receipt #'+r.no+'  '+r.date+' '+r.time,'------------------------------',...r.lines.map(l=>l.qty+' x '+l.name+'  '+kes(l.amt)),'------------------------------','TOTAL '+kes(r.total),'Paid by '+(r.method==='mpesa'?'M-Pesa '+r.phone:'Cash'),'Demo by NOX Digital'].join('\n')}
function csv(){const rows=[['Receipt','Date','Time','Method','Item','Category','Qty','Amount']];S.sales.forEach(s=>s.lines.forEach(l=>rows.push([s.no,s.date,s.time,s.method,l.name,l.cat,l.qty,l.amt])));dl('agrovet-demo-sales.csv',rows.map(r=>r.map(c=>'"'+c+'"').join(',')).join('\n'),'text/csv')}
function addProduct(e){e.preventDefault();const f=e.target,p=+f.price.value,st=+f.stock.value;if(!f.name.value.trim()||!(p>0)||!(st>=0))return;
  S.stock.push({id:Date.now(),name:f.name.value.trim(),cat:f.cat.value,price:p,stock:st});save();render()}
function restock(id){S.stock.find(s=>s.id==id).stock+=10;save();render()}
function set(k,v){({view:()=>view=v,cat:()=>cat=v,method:()=>method=v})[k]();render()}
function render(){
  $('#nav').innerHTML=[['sell','Sales'],['stock','Stock'],['report','Reports']].map(([k,l])=>`<button class="${view===k?'on':''}" onclick="set('view','${k}')">${l}</button>`).join('');
  const low=S.stock.filter(s=>s.stock<=LOW);
  $('#kpis').innerHTML=`<div><small>Today's sales</small><b>${kes(S.sales.reduce((a,s)=>a+s.total,0))}</b></div><div><small>Receipts</small><b>${S.sales.length}</b></div><div><small>Items in stock</small><b>${S.stock.reduce((a,s)=>a+s.stock,0)}</b></div><div class="${low.length?'warn':''}"><small>Low stock</small><b>${low.length}</b></div>`;
  const V=$('#view');
  if(view==='sell'){
    const items=S.stock.filter(s=>(cat==='All'||s.cat===cat)&&s.name.toLowerCase().includes(q.toLowerCase()));
    const L=lines();
    let right;
    if(paid){right=`<div class="rc"><h3>Receipt #${paid.no}</h3><small class="dim">${paid.time} · ${paid.method==='mpesa'?'M-Pesa '+esc(paid.phone):'Cash'}</small>${paid.lines.map(l=>`<div><span>${l.qty}× ${esc(l.name)}</span><span>${kes(l.amt)}</span></div>`).join('')}<div class="t"><span>Total</span><b>${kes(paid.total)}</b></div><div class="row"><button class="btn ghost" onclick="window.print()">Print</button><button class="btn ghost" onclick="dl('receipt-${paid.no}.txt',rtext(S.sales.find(s=>s.no==${paid.no})))">Download</button></div><button class="btn" onclick="paid=null;render()">New sale</button></div>`}
    else right=`<h3>Current sale</h3>${L.length?'':'<p class="dim" style="margin:4px 0">Tap a product to add it.</p>'}${L.map(s=>`<div class="line"><span>${esc(s.name)}</span><span class="qty"><button onclick="dec(${s.id})">−</button> ${cart[s.id]} <button onclick="add(${s.id})">+</button></span><b>${kes(s.price*cart[s.id])}</b></div>`).join('')}
      <div class="seg"><button class="${method==='cash'?'on':''}" onclick="set('method','cash')">Cash</button><button class="${method==='mpesa'?'on':''}" onclick="set('method','mpesa')">M-Pesa</button></div>
      ${method==='mpesa'?`<input aria-label="Customer phone" value="${esc(phone)}" oninput="phone=this.value">`:''}
      <div class="total"><span>Total</span><b>${kes(total())}</b></div>
      <button class="btn" ${!total()||stk?'disabled':''} onclick="pay()">${stk?'Waiting for M-Pesa…':method==='mpesa'?'Send M-Pesa prompt':'Take cash & print receipt'}</button>`;
    V.innerHTML=`<div class="sell"><div><input id="q" placeholder="Search products…" value="${esc(q)}"><div class="cats">${CATS.map(c=>`<button class="${cat===c?'on':''}" onclick="set('cat','${c}')">${c}</button>`).join('')}</div><div class="items">${items.map(s=>`<button ${s.stock===0||(cart[s.id]||0)>=s.stock?'disabled':''} onclick="add(${s.id})"><span>${esc(s.name)}</span><b>${kes(s.price)}</b><small class="${s.stock<=LOW?'low':''}">${s.stock===0?'Out of stock':s.stock+' in stock'}</small></button>`).join('')||'<p class="dim">No products match.</p>'}</div></div><div class="cart">${right}</div></div>`;
    const qi=$('#q');qi.oninput=()=>{q=qi.value;const p=qi.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)};
  }
  if(view==='stock'){
    V.innerHTML=`<div class="grid2"><table><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr></thead><tbody>${S.stock.map(s=>`<tr class="${s.stock<=LOW?'lowrow':''}"><td>${esc(s.name)}</td><td>${s.cat}</td><td>${kes(s.price)}</td><td>${s.stock}${s.stock<=LOW?' · low':''}</td><td><button class="mini" onclick="restock(${s.id})">+10</button></td></tr>`).join('')}</tbody></table>
    <form class="panel" onsubmit="addProduct(event)"><h4>Add a product</h4><input name="name" placeholder="Name" aria-label="Name"><select name="cat">${CATS.slice(1).map(c=>`<option>${c}</option>`).join('')}</select><input name="price" type="number" min="1" placeholder="Price" aria-label="Price"><input name="stock" type="number" min="0" placeholder="Stock" aria-label="Stock"><button class="btn">Add product</button></form></div>`;
  }
  if(view==='report'){
    if(!S.sales.length){V.innerHTML='<p class="dim">No sales yet. Make a sale, then come back to see your reports.</p>';return}
    const m={},t={};S.sales.forEach(s=>s.lines.forEach(l=>{m[l.cat]=(m[l.cat]||0)+l.amt;t[l.name]=(t[l.name]||0)+l.qty}));
    const cats=Object.entries(m).sort((a,b)=>b[1]-a[1]),max=Math.max(...cats.map(x=>x[1])),top=Object.entries(t).sort((a,b)=>b[1]-a[1]).slice(0,5);
    V.innerHTML=`<div class="rep"><div class="panel"><h4>Sales by category</h4>${cats.map(([c,v])=>`<div class="bar"><span>${c}</span><i><u style="width:${v/max*100}%"></u></i><b>${kes(v)}</b></div>`).join('')}<h4 style="margin-top:10px">Top sellers</h4><ul>${top.map(([n,v])=>`<li class="r"><span>${esc(n)}</span><b>${v} sold</b></li>`).join('')}</ul></div>
    <div class="panel"><h4>Recent receipts</h4><ul>${S.sales.slice(0,8).map(s=>`<li class="r"><span>#${s.no} · ${s.time} · ${s.method==='mpesa'?'M-Pesa':'Cash'}</span><b>${kes(s.total)}</b></li>`).join('')}</ul><button class="btn ghost" onclick="csv()">Export sales (CSV)</button></div></div>`;
  }
}
render();
</script>
</body>
</html>
